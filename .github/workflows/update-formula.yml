name: Update Formula

on:
  repository_dispatch:
    types: [update-formula]
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel'
        required: true
        type: choice
        options:
          - stable
          - nightly
          - testing
      mull_version:
        description: 'Mull version'
        required: true
      llvm_version:
        description: 'LLVM major version, empty for the mull tools formula'
        required: false
      package_filename:
        description: 'Package filename'
        required: true
      package_sha256:
        description: 'Package SHA256'
        required: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      CHANNEL: ${{ github.event.client_payload.channel || inputs.channel }}
      MULL_VERSION: ${{ github.event.client_payload.mull_version || inputs.mull_version }}
      LLVM_VERSION: ${{ github.event.client_payload.llvm_version || inputs.llvm_version }}
      PACKAGE_FILENAME: ${{ github.event.client_payload.package_filename || inputs.package_filename }}
      PACKAGE_SHA256: ${{ github.event.client_payload.package_sha256 || inputs.package_sha256 }}

    steps:
      - uses: actions/checkout@v4

      - name: Update formula, commit and push
        run: |
          # Empty LLVM_VERSION: the LLVM-independent tools (mull.rb, Cloudsmith package `mull`)
          if [[ -z "$LLVM_VERSION" ]]; then
            SUFFIX=""
            PACKAGE="mull"
          else
            SUFFIX="@${LLVM_VERSION}"
            PACKAGE="mull-${LLVM_VERSION}"
          fi
          if [[ "$CHANNEL" == "stable" ]]; then
            NAME="mull${SUFFIX}"
          else
            NAME="mull-${CHANNEL}${SUFFIX}"
          fi
          FORMULA="Formula/${NAME}.rb"

          if [[ ! -f "$FORMULA" ]]; then
            echo "Error: Formula not found: $FORMULA"
            exit 1
          fi

          URL="https://dl.cloudsmith.io/public/mull-project/mull-${CHANNEL}/raw/names/${PACKAGE}/versions/${MULL_VERSION}/${PACKAGE_FILENAME}"

          echo "Updating $FORMULA"
          echo "  Version: $MULL_VERSION"
          echo "  URL: $URL"
          echo "  SHA256: $PACKAGE_SHA256"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Other runs may push concurrently. Instead of rebasing (which conflicts
          # when two runs touch the same formula), start from the latest master and
          # re-apply the edit on every attempt.
          for i in {1..10}; do
            git fetch origin master
            git reset --hard origin/master

            sed -i "s|version \"[^\"]*\"|version \"${MULL_VERSION}\"|" "$FORMULA"
            sed -i "s|url \"[^\"]*\"|url \"${URL}\"|" "$FORMULA"
            sed -i "s|sha256 \"[^\"]*\"|sha256 \"${PACKAGE_SHA256}\"|" "$FORMULA"

            git add Formula/
            if git diff --staged --quiet; then
              echo "No changes to commit"
              exit 0
            fi

            git commit -m "Update ${NAME} to ${MULL_VERSION}"
            git push origin HEAD:master && exit 0

            echo "Push failed (attempt $i), retrying..."
            sleep $(( RANDOM % 10 + i * 2 ))
          done
          exit 1
